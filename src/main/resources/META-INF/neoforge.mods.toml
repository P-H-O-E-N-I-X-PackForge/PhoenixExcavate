modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''
Phoenix Excavate - a themed, configurable vein miner and vein placer.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_wiki"
type = "required"
versionRange = "[0.5.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbchunks"
type = "optional"
versionRange = "[2101.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_domains"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "NONE"
side = "BOTH"
